<div class="p-6">

  <h1 class="text-2xl font-bold mb-6">📊 Dashboard</h1>

  <!-- STATS CARDS -->
  <div class="grid grid-cols-4 gap-4 mb-6">

    <div class="bg-blue-500 text-white p-4 rounded">
      <h2>Events</h2>
      <p class="text-xl">{{ stats?.totalEvents }}</p>
    </div>

    <div class="bg-green-500 text-white p-4 rounded">
      <h2>Registrations</h2>
      <p class="text-xl">{{ stats?.totalRegistrations }}</p>
    </div>

    <div class="bg-purple-500 text-white p-4 rounded">
      <h2>Participants</h2>
      <p class="text-xl">{{ stats?.totalParticipants }}</p>
    </div>

    <div class="bg-yellow-500 text-white p-4 rounded">
      <h2>Revenue</h2>
      <p class="text-xl">{{ stats?.totalRevenue }} DT</p>
    </div>

  </div>

  <!-- 📊 CHART -->
  <div class="bg-white p-4 rounded shadow mb-6">
    <canvas id="statsChart"></canvas>
  </div>

  <!-- 🔥 TOP EVENTS -->
  <div class="bg-white p-4 rounded shadow">
    <h2 class="text-xl mb-4">🔥 Top Events</h2>

    <div *ngFor="let e of getTopEvents()" class="border-b py-2">
      <strong>{{ e.title }}</strong>
      <p>👥 {{ e.currentParticipants }} participants</p>
    </div>
  </div>

</div>
