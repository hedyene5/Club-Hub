spring.application.name=Gateway
server.port=8084

# ===========================================================================
# ROUTES — une route par pattern (les Path multiples comma-separated ne sont
# pas correctement gérés en `server.webflux.routes[*].predicates[0]` et les
# multiples predicates sont combinés en AND donc inutilisables ici).
# ===========================================================================

# ----- User Service (auth, users, roles, permissions) -----
spring.cloud.gateway.server.webflux.routes[0].id=user-auth
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

