# ----- Virtual Event Management (online events, registration, meeting link) -----
# VEM tourne en local sur 8086. URI directe (pas `lb://`) : sans ça, si Eureka
# n'est pas lancé ou le service n'est pas enregistré, le Gateway ne résout pas
# `lb://virtual-event-management` → 503/erreur → navigateur: Http status 0 (CORS).
# Pour la prod mult-instance, on pourra repasser sur `lb://virtual-event-management`.
spring.cloud.gateway.server.webflux.routes[21].id=virtual-events
spring.cloud.gateway.server.webflux.routes[21].uri=lb://virtual-event-management
spring.cloud.gateway.server.webflux.routes[21].predicates[0]=Path=/api/virtual-events/**

spring.cloud.gateway.server.webflux.routes[22].id=virtual-events-records
spring.cloud.gateway.server.webflux.routes[22].uri=lb://virtual-event-management
spring.cloud.gateway.server.webflux.routes[22].predicates[0]=Path=/api/records/**

spring.cloud.gateway.server.webflux.routes[23].id=virtual-events-transcriptions
spring.cloud.gateway.server.webflux.routes[23].uri=lb://virtual-event-management
spring.cloud.gateway.server.webflux.routes[23].predicates[0]=Path=/api/transcriptions/**

# ----- Voice2 backend (isolé pour intégration non destructive) -----
# Expose le service InstantVoiceManagment sous un préfixe dédié:
# /api/voice2/*  ->  /api/*
# /ws/voice2/*   ->  /ws/*
spring.cloud.gateway.server.webflux.routes[24].id=voice2-channels
spring.cloud.gateway.server.webflux.routes[24].uri=lb://instant-voice-management
spring.cloud.gateway.server.webflux.routes[24].predicates[0]=Path=/api/voice2/channels,/api/voice2/channels/**
spring.cloud.gateway.server.webflux.routes[24].filters[0]=RewritePath=/api/voice2/channels/?(?<segment>.*), /api/channels/$\{segment}

spring.cloud.gateway.server.webflux.routes[25].id=voice2-audio
spring.cloud.gateway.server.webflux.routes[25].uri=lb://instant-voice-management
spring.cloud.gateway.server.webflux.routes[25].predicates[0]=Path=/api/voice2/audio/**
spring.cloud.gateway.server.webflux.routes[25].filters[0]=RewritePath=/api/voice2/audio/(?<segment>.*), /api/audio/$\{segment}

spring.cloud.gateway.server.webflux.routes[26].id=voice2-voice
spring.cloud.gateway.server.webflux.routes[26].uri=lb://instant-voice-management
spring.cloud.gateway.server.webflux.routes[26].predicates[0]=Path=/api/voice2/voice/**
spring.cloud.gateway.server.webflux.routes[26].filters[0]=RewritePath=/api/voice2/voice/(?<segment>.*), /api/voice/$\{segment}

spring.cloud.gateway.server.webflux.routes[27].id=voice2-notifications
spring.cloud.gateway.server.webflux.routes[27].uri=lb://instant-voice-management
spring.cloud.gateway.server.webflux.routes[27].predicates[0]=Path=/api/voice2/notifications/**
