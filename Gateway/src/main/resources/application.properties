spring.cloud.gateway.server.webflux.routes[28].predicates[0]=Path=/ws/voice2/**
spring.cloud.gateway.server.webflux.routes[28].filters[0]=RewritePath=/ws/voice2/(?<segment>.*), /ws/$\{segment}

spring.cloud.gateway.server.webflux.routes[29].id=voice2-reports
spring.cloud.gateway.server.webflux.routes[29].uri=lb://instant-voice-management
spring.cloud.gateway.server.webflux.routes[29].predicates[0]=Path=/api/voice2/reports,/api/voice2/reports/**
