<header class="fixed top-0 left-0 z-50 flex items-center justify-between w-full h-16 bg-white border-b border-gray-200 px-6 dark:bg-gray-900 dark:border-gray-800">
  
  <div class="flex items-center gap-8">
    <a routerLink="/" class="flex items-center gap-3">
      <img src="/images/logo/logo.svg" alt="Logo" width="120" class="dark:hidden" />
      <img src="/images/logo/logo-dark.svg" alt="Logo" width="120" class="hidden dark:block" />
    </a>

    <nav class="hidden lg:block">
      <ul class="flex items-center gap-2">
        @for (item of navItems; track $index) {
          <li class="relative">
            <a [routerLink]="item.path" 
               class="px-3 py-2 text-sm font-medium text-gray-700 rounded-md hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-800">
              {{ item.name }}
            </a>
          </li>
        }
      </ul>
    </nav>
  </div>

  <div class="flex items-center gap-4">
    
    <div class="relative hidden xl:block">
      <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor">
          <path d="M14.357 15.4176L17.177 18.238" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="9.375" cy="9.373" r="6.333" stroke-width="1.5"/>
        </svg>
      </span>
      <input #searchInput type="text" placeholder="Search or type command..."
        class="h-10 w-64 rounded-lg border border-gray-200 bg-gray-50 pl-11 pr-14 text-sm dark:bg-white/[0.03] dark:border-gray-800 dark:text-white" />
      <button class="absolute right-2 top-1/2 -translate-y-1/2 px-1.5 py-0.5 text-[10px] border border-gray-200 rounded text-gray-400">
        ⌘ K
      </button>
    </div>

    <div class="flex items-center gap-3 pl-4 border-l border-gray-100 dark:border-gray-800">
      <app-theme-toggle-button />
      <app-notification-dropdown />
      <app-user-dropdown />
    </div>

    <button (click)="handleToggle()" class="p-2 text-gray-500 lg:hidden">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16m-7 6h7" stroke-width="2"/></svg>
    </button>
  </div>
</header>
