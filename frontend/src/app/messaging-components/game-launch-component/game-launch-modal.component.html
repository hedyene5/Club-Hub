<!-- src/app/components/Game/game-launch-modal/game-launch-modal.component.html -->

<div class="bg-white rounded-3xl shadow-2xl w-[520px] max-h-[90vh] overflow-hidden flex flex-col animate-in zoom-in-95 duration-200"
     (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="bg-gradient-to-r from-indigo-600 to-purple-600 px-8 py-6 text-white">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-white/20 rounded-2xl flex items-center justify-center text-2xl backdrop-blur-sm">
                    🎮
                </div>
                <div>
                    <h2 class="text-xl font-black tracking-tight">Start a Quiz Game</h2>
                    <p class="text-indigo-200 text-xs font-medium mt-0.5">Configure your trivia challenge</p>
                </div>
            </div>
            <button (click)="closeModal()"
                    class="w-10 h-10 bg-white/10 hover:bg-white/20 rounded-xl flex items-center justify-center transition-all backdrop-blur-sm">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Content -->
    <div class="overflow-y-auto flex-1 p-6 space-y-6">

        <!-- Category Selection -->
        <div>
            <label class="text-[11px] font-black text-slate-400 uppercase tracking-widest mb-3 block">Category</label>
            <div class="grid grid-cols-2 gap-2">
                <button *ngFor="let cat of categories"
                        (click)="selectedCategory = cat.value"
                        [class]="selectedCategory === cat.value
                  ? 'bg-indigo-50 border-indigo-200 text-indigo-700 shadow-indigo-100'
                  : 'bg-white border-slate-100 text-slate-600 hover:bg-slate-50'"
                        class="flex items-center gap-2.5 p-3 rounded-xl border-2 transition-all text-left">
                    <span class="text-lg">{{ cat.icon }}</span>
                    <span class="text-sm font-semibold">{{ cat.label }}</span>
                </button>
            </div>
        </div>

        <!-- Difficulty Selection -->
        <div>
            <label class="text-[11px] font-black text-slate-400 uppercase tracking-widest mb-3 block">Difficulty</label>
            <div class="flex gap-2">
                <button *ngFor="let diff of difficulties"
                        (click)="selectedDifficulty = diff.value"
                        [class]="selectedDifficulty === diff.value
                  ? 'bg-indigo-50 border-indigo-200 text-indigo-700 ring-2 ring-indigo-100'
                  : 'bg-white border-slate-100 text-slate-600 hover:bg-slate-50'"
                        class="flex-1 p-3 rounded-xl border-2 transition-all text-center">
                    <div class="text-xl mb-1">{{ diff.icon }}</div>
                    <div class="text-sm font-bold">{{ diff.label }}</div>
                    <div class="text-[10px] mt-0.5 opacity-70">{{ diff.desc }}</div>
                </button>
            </div>
        </div>

        <!-- Question Count -->
        <div>
            <label class="text-[11px] font-black text-slate-400 uppercase tracking-widest mb-3 block">
                Number of Questions: <span class="text-indigo-600">{{ selectedQuestionCount }}</span>
            </label>
            <div class="flex gap-2">
                <button *ngFor="let count of questionCounts"
                        (click)="selectedQuestionCount = count"
                        [class]="selectedQuestionCount === count
                  ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-100'
                  : 'bg-white text-slate-600 border border-slate-100 hover:bg-slate-50'"
                        class="flex-1 py-3 rounded-xl font-bold text-sm transition-all">
                    {{ count }}
                </button>
            </div>
        </div>

        <!-- Time Limit -->
        <div>
            <label class="text-[11px] font-black text-slate-400 uppercase tracking-widest mb-3 block">
                Time per Question: <span class="text-indigo-600">{{ selectedTimeLimit }}s</span>
            </label>
            <div class="flex gap-2">
                <button *ngFor="let time of timeLimits"
                        (click)="selectedTimeLimit = time"
                        [class]="selectedTimeLimit === time
                  ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-100'
                  : 'bg-white text-slate-600 border border-slate-100 hover:bg-slate-50'"
                        class="flex-1 py-3 rounded-xl font-bold text-sm transition-all">
                    {{ time }}s
                </button>
            </div>
        </div>

        <!-- Error Message -->
        <div *ngIf="error" class="bg-red-50 border border-red-100 text-red-600 p-3 rounded-xl text-sm font-medium flex items-center gap-2">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            {{ error }}
        </div>
    </div>

    <!-- Footer -->
    <div class="border-t border-slate-100 px-6 py-4 flex items-center justify-between bg-slate-50/50">
        <button (click)="closeModal()"
                class="px-5 py-2.5 text-slate-500 hover:text-slate-700 text-sm font-semibold transition-colors">
            Cancel
        </button>
        <button (click)="createGame()"
                [disabled]="loading"
                class="px-8 py-2.5 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white rounded-xl font-bold text-sm shadow-lg shadow-indigo-100 transition-all flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
            <span *ngIf="loading" class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
            <span *ngIf="!loading">🎮</span>
            {{ loading ? 'Creating...' : 'Create Game' }}
        </button>
    </div>
</div>
