<div class="bg-white rounded-[2rem] shadow-2xl w-full max-w-[540px] max-h-[95vh] overflow-hidden flex flex-col animate-in zoom-in-95 fade-in duration-300 ring-1 ring-black/5"
     (click)="$event.stopPropagation()">

    <header class="bg-gradient-to-br from-indigo-600 via-indigo-700 to-purple-700 px-8 py-7 text-white relative overflow-hidden shrink-0">
        <div class="absolute -top-12 -right-12 w-32 h-32 bg-white/10 rounded-full blur-3xl"></div>

        <div class="relative z-10 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 bg-white/15 backdrop-blur-md rounded-2xl flex items-center justify-center text-3xl shadow-inner border border-white/20">
                    🎮
                </div>
                <div>
                    <h2 class="text-2xl font-black tracking-tight leading-tight">Create Quiz</h2>
                    <p class="text-indigo-100/80 text-xs font-bold uppercase tracking-widest mt-1">Lobby Configuration</p>
                </div>
            </div>
            <button (click)="closeModal()"
                    class="group w-10 h-10 bg-black/10 hover:bg-white/20 rounded-full flex items-center justify-center transition-all duration-300">
                <svg class="w-5 h-5 group-hover:rotate-90 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
    </header>

    <div class="overflow-y-auto flex-1 p-8 space-y-8 custom-scrollbar">

        <section>
            <div class="flex items-center justify-between mb-4">
                <label class="text-[11px] font-black text-slate-400 uppercase tracking-widest">Select Category</label>
                <span class="text-[10px] bg-slate-100 px-2 py-0.5 rounded-md font-bold text-slate-500 italic">Trivia API</span>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <button *ngFor="let cat of categories"
                        (click)="selectedCategory = cat.value"
                        [class]="selectedCategory === cat.value
                            ? 'bg-indigo-600 border-indigo-600 text-white shadow-xl shadow-indigo-200 -translate-y-0.5'
                            : 'bg-slate-50 border-transparent text-slate-600 hover:border-slate-200 hover:bg-slate-100'"
                        class="flex items-center gap-3 p-4 rounded-2xl border-2 transition-all duration-200 text-left group">
                    <span class="text-2xl transition-transform group-hover:scale-110" [class.filter-none]="selectedCategory === cat.value">{{ cat.icon }}</span>
                    <span class="text-sm font-bold tracking-tight">{{ cat.label }}</span>
                </button>
            </div>
        </section>

        <section>
            <label class="text-[11px] font-black text-slate-400 uppercase tracking-widest mb-4 block">Challenge Level</label>
            <div class="flex gap-3">
                <button *ngFor="let diff of difficulties"
                        (click)="selectedDifficulty = diff.value"
                        [class]="selectedDifficulty === diff.value
                            ? 'bg-white border-indigo-600 ring-4 ring-indigo-50 shadow-sm'
                            : 'bg-white border-slate-100 opacity-60 hover:opacity-100'"
                        class="flex-1 p-4 rounded-2xl border-2 transition-all text-center">
                    <div class="text-xl mb-1">{{ diff.icon }}</div>
                    <div class="text-[13px] font-black uppercase tracking-tighter"
                         [class.text-indigo-600]="selectedDifficulty === diff.value">
                        {{ diff.label }}
                    </div>
                </button>
            </div>
            <p class="mt-3 text-[11px] text-slate-400 font-medium italic text-center">
                "{{ difficulties[getSelectedDifficultyIndex()].desc }}"
            </p>
        </section>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 pt-2">
            <div>
                <label class="text-[11px] font-black text-slate-400 uppercase tracking-widest mb-4 block">
                    Questions: <span class="text-indigo-600 font-black">{{ selectedQuestionCount }}</span>
                </label>
                <div class="grid grid-cols-4 gap-2">
                    <button *ngFor="let count of questionCounts"
                            (click)="selectedQuestionCount = count"
                            [class]="selectedQuestionCount === count ? 'bg-indigo-600 text-white shadow-lg' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'"
                            class="py-2.5 rounded-xl font-black text-xs transition-all">
                        {{ count }}
                    </button>
                </div>
            </div>

            <div>
                <label class="text-[11px] font-black text-slate-400 uppercase tracking-widest mb-4 block">
                    Per Round: <span class="text-indigo-600 font-black">{{ selectedTimeLimit }}s</span>
                </label>
                <div class="grid grid-cols-4 gap-2">
                    <button *ngFor="let time of timeLimits"
                            (click)="selectedTimeLimit = time"
                            [class]="selectedTimeLimit === time ? 'bg-indigo-600 text-white shadow-lg' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'"
                            class="py-2.5 rounded-xl font-black text-xs transition-all">
                        {{ time }}s
                    </button>
                </div>
            </div>
        </div>

        <div *ngIf="error" class="bg-rose-50 border border-rose-100 text-rose-600 p-4 rounded-2xl text-sm font-bold flex items-center gap-3 animate-in fade-in slide-in-from-top-2">
            <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            {{ error }}
        </div>
    </div>

    <footer class="border-t border-slate-100 px-8 py-6 flex items-center justify-between bg-slate-50/50 shrink-0">
        <button (click)="closeModal()"
                class="px-4 py-2 text-slate-400 hover:text-slate-600 font-bold text-sm uppercase tracking-widest transition-colors">
            Discard
        </button>
        <button (click)="createGame()"
                [disabled]="loading"
                class="relative px-10 py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-black text-sm uppercase tracking-[0.1em] shadow-[0_10px_25px_-5px_rgba(79,70,229,0.4)] transition-all hover:-translate-y-0.5 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
            <span *ngIf="loading" class="flex items-center gap-3">
                <svg class="animate-spin h-4 w-4 text-white" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Deploying...
            </span>
            <span *ngIf="!loading">Launch Match →</span>
        </button>
    </footer>
</div>
