<div class="fixed inset-0 z-[150] flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm animate-in fade-in duration-300" (click)="closeModal()"></div>

    <div class="relative bg-white w-full max-w-[420px] rounded-[3rem] shadow-2xl animate-in zoom-in-95 duration-300">
        <div class="p-10">
            <div class="text-center mb-8">
                <div class="w-20 h-20 rounded-3xl bg-indigo-600 mx-auto mb-4 flex items-center justify-center text-white shadow-xl shadow-indigo-100">
                    <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                    </svg>
                </div>
                <h3 class="text-xl font-black text-slate-800 tracking-tight">Nouvelle Discussion</h3>
            </div>

            <div class="relative mb-8">
                <label class="block px-2 mb-2 text-[10px] font-black text-slate-400 uppercase tracking-widest">Rechercher un membre</label>
                <div class="relative">
                    <input
                            type="text"
                            [(ngModel)]="searchTerm"
                            (input)="onSearchInput()"
                            placeholder="Nom ou ID de l'utilisateur..."
                            class="w-full p-5 pl-14 bg-slate-50 border-none rounded-[1.5rem] text-sm font-bold text-slate-700 outline-none focus:bg-white focus:ring-4 focus:ring-indigo-500/10 transition-all placeholder:text-slate-300"
                    />
                    <svg class="absolute left-5 top-5 w-5 h-5 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-width="2.5"/></svg>
                </div>

                <div *ngIf="searchResults.length > 0"
                     class="absolute w-full mt-3 bg-white border border-slate-100 rounded-[2rem] shadow-2xl max-h-64 overflow-auto z-[200] p-3 animate-in fade-in slide-in-from-top-2">
                    <div *ngFor="let user of searchResults"
                         (click)="selectUser(user)"
                         class="flex items-center gap-4 p-4 hover:bg-slate-50 rounded-[1.2rem] cursor-pointer transition-all group">

                        <div class="w-10 h-10 rounded-xl bg-indigo-50 flex items-center justify-center text-indigo-600 text-xs font-black">
                            {{ user.fullName.charAt(0).toUpperCase() }}
                        </div>

                        <div class="flex-1">
                            <p class="text-[14px] font-black text-slate-700">{{ user.fullName }}</p>
                            <p class="text-[10px] text-slate-400 font-bold uppercase">
                                <span>&#64;</span>{{ user.userId }}
                            </p>
                        </div>
                        <span class="text-indigo-500 font-black text-lg opacity-0 group-hover:opacity-100 transition-opacity">+</span>
                    </div>
                </div>
            </div>

            <div *ngIf="errorMessage" class="mb-6 p-4 bg-red-50 text-red-500 text-[10px] font-black uppercase tracking-widest rounded-2xl text-center">
                {{ errorMessage }}
            </div>

            <div class="flex items-center gap-4">
                <button (click)="closeModal()"
                        class="flex-1 py-5 text-[12px] font-black uppercase tracking-widest text-slate-400 hover:text-slate-600 transition-colors">
                    Annuler
                </button>
                <button (click)="createConversation()"
                        [disabled]="!selectedUser || loading"
                        class="flex-1 py-5 bg-indigo-100 text-indigo-600 rounded-[1.5rem] font-black text-[12px] uppercase tracking-widest hover:bg-indigo-600 hover:text-white disabled:opacity-30 transition-all shadow-sm">
                    {{ loading ? 'Création...' : 'Lancer le Chat' }}
                </button>
            </div>
        </div>
    </div>
</div>
