<!-- src/app/messaging-components/Game Banner Component/game-banner.component.html -->

<div *ngIf="showBanner && gameData"
     class="mx-4 mb-4 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 rounded-2xl p-5 text-white shadow-xl shadow-indigo-200/50 animate-in slide-in-from-top duration-300 relative overflow-hidden">

    <div class="absolute inset-0 opacity-10">
        <div class="absolute top-0 right-0 w-32 h-32 bg-white rounded-full -translate-y-1/2 translate-x-1/2"></div>
        <div class="absolute bottom-0 left-0 w-24 h-24 bg-white rounded-full translate-y-1/2 -translate-x-1/2"></div>
    </div>

    <div class="relative z-10">
        <button (click)="dismissBanner()"
                class="absolute top-0 right-0 w-8 h-8 bg-white/10 hover:bg-white/20 rounded-lg flex items-center justify-center transition-all">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
        </button>

        <div class="flex items-center gap-3 mb-4">
            <div class="w-12 h-12 bg-white/20 backdrop-blur-sm rounded-xl flex items-center justify-center text-2xl animate-bounce">
                🎮
            </div>
            <div>
                <h3 class="font-black text-lg tracking-tight">Quiz Game Started!</h3>
                <p class="text-white/70 text-xs font-medium">{{ gameData.category }} • {{ gameData.totalQuestions}} questions • {{ gameData.timeLimitPerQuestion }}s each</p>
            </div>
        </div>

        <div class="flex items-center gap-2 mb-4">
            <div class="flex -space-x-2">
                <div class="w-8 h-8 bg-white/20 rounded-full border-2 border-white/30 flex items-center justify-center text-xs">👤</div>
                <div *ngIf="playerCount > 1" class="w-8 h-8 bg-white/20 rounded-full border-2 border-white/30 flex items-center justify-center text-xs">👤</div>
            </div>
            <span class="text-sm font-semibold">
        <span class="text-yellow-300">{{ playerCount }}</span> player{{ playerCount !== 1 ? 's' : '' }} waiting
      </span>
        </div>

        <div class="flex gap-3">
            <button *ngIf="isCreator"
                    (click)="startGame()"
                    class="flex-1 py-3 bg-white text-indigo-600 rounded-xl font-black text-sm uppercase tracking-wider shadow-lg hover:shadow-xl transition-all hover:scale-[1.02] active:scale-[0.98]">
                🚀 Start Game
            </button>

            <!-- ✅ FIXED: Show different states for join button -->
            <button *ngIf="!isCreator && !hasJoined"
                    (click)="joinGame()"
                    [disabled]="joining"
                    class="flex-1 py-3 bg-white text-indigo-600 rounded-xl font-black text-sm uppercase tracking-wider shadow-lg hover:shadow-xl transition-all hover:scale-[1.02] active:scale-[0.98] disabled:opacity-50">
                {{ joining ? 'Joining...' : '✋ Join Now' }}
            </button>

            <button *ngIf="!isCreator && hasJoined"
                    disabled
                    class="flex-1 py-3 bg-white/30 text-white rounded-xl font-black text-sm uppercase tracking-wider cursor-not-allowed">
                ✓ Joined
            </button>

            <button *ngIf="!isCreator && !hasJoined && !joining"
                    (click)="dismissBanner()"
                    class="px-5 py-3 bg-white/10 hover:bg-white/20 rounded-xl font-bold text-sm transition-all backdrop-blur-sm">
                Maybe Later
            </button>
        </div>
    </div>
</div>
