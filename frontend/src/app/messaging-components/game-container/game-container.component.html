<div #fullscreenContainer class="relative w-full h-full">

    <button (click)="toggleFullscreen()"
            *ngIf="gamePhase"
            class="fixed top-4 right-4 z-[100] p-3 bg-white/10 hover:bg-white/20 backdrop-blur-md rounded-2xl text-white transition-all shadow-xl border border-white/10 group">
        <svg *ngIf="!isFullscreen" class="w-6 h-6 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/>
        </svg>
        <svg *ngIf="isFullscreen" class="w-6 h-6 group-hover:scale-90 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 9L4 4m0 0h4M4 4v4m5 11l-5-5m0 0v4m0-4h4m11 5l-5-5m0 0h4m0 0v4m-5-11l5-5m0 0h-4m4 0v4"/>
        </svg>
    </button>

    <app-game-question
            *ngIf="gamePhase === 'QUESTION'"
            #questionComp
            [gameId]="gameId"
            [currentUserId]="currentUserId"
            (answerSubmitted)="onAnswerSubmitted()">
    </app-game-question>

    <app-answer-reveal
            *ngIf="gamePhase === 'REVEAL'"
            [event]="revealEvent"
            [selectedAnswer]="selectedAnswer"
            [currentUserId]="currentUserId">
    </app-answer-reveal>

    <app-game-leaderboard
            *ngIf="gamePhase === 'LEADERBOARD'"
            [event]="leaderboardEvent"
            [currentUserId]="currentUserId"
            [conversationId]="conversationId"
            (playAgain)="onPlayAgain()"
            (close)="onCloseGame()">
    </app-game-leaderboard>
</div>
