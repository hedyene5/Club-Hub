<div class="relative w-full" (click)="$event.stopPropagation()">

    <div *ngIf="showEmojiPicker" class="emoji-mart-wrapper">
        <emoji-mart
                (emojiSelect)="handleEmojiSelect($event)"
                [isNative]="false"
                [showPreview]="false"
                [enableSearch]="true"
                [darkMode]="false"
                title="ClubHub Emojis"
                set="apple">
        </emoji-mart>
    </div>

    <div class="flex gap-3 items-end p-2.5 bg-white/80 backdrop-blur-md border-t border-slate-100">

        <div class="flex-1 flex items-end bg-slate-100 rounded-[24px] px-3 py-1.5 transition-all focus-within:ring-2 focus-within:ring-indigo-500/20"
             [style.backgroundColor]="'var(--bubble-color)'">

            <button (click)="toggleEmojiPicker()"
                    class="p-2 text-slate-500 hover:text-indigo-600 active:scale-90 transition-transform">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </button>

            <textarea
                #messageArea
                [(ngModel)]="messageText"
                (input)="adjustHeight(messageArea)"
                (keydown.enter)="handleEnter($event)"
                placeholder="Type a message..."
                rows="1"
                class="flex-1 bg-transparent border-none py-2 px-2 text-sm outline-none resize-none max-h-32 overflow-y-auto leading-relaxed">
            </textarea>
        </div>

        <button (click)="onSend()"
                [disabled]="!messageText.trim()"
                class="bg-indigo-600 hover:bg-indigo-700 disabled:opacity-30 text-white w-10 h-10 rounded-full flex items-center justify-center shadow-lg transition-all active:scale-90"
                [style.backgroundColor]="'var(--primary-color)'">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 rotate-45" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
            </svg>
        </button>
    </div>
</div>
