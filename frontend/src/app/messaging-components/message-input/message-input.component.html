<div class="relative bg-white p-4" (click)="$event.stopPropagation()"
   >

    <div *ngIf="showEmojiPicker"
         class="emoji-mart-wrapper absolute bottom-full mb-4 left-0 z-[100]">
        <emoji-mart
                (emojiSelect)="handleEmojiSelect($event)"
                [isNative]="false"
                [showPreview]="false"
                [enableSearch]="true"
                [darkMode]="false"
                [custom]="customEmojis"
                title="ClubHub Emojis"
                emoji="point_up"
                set="apple">
        </emoji-mart>
    </div>

    <div class="flex gap-3 items-center">
        <div class="flex-1 flex items-center bg-slate-100 rounded-3xl px-2 focus-within:bg-white focus-within:ring-2 focus-within:ring-indigo-500/20 transition-all border border-transparent"
 style= " background-color: var(--bubble-color);">

            <button (click)="toggleEmojiPicker()"
                    class="p-2.5 text-slate-400 hover:text-indigo-600 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </button>

            <input
                    type="text"
                    [(ngModel)]="messageText"
                    (keyup)="onKeyUp($event)"
                    placeholder="Type a message..."
                    class="flex-1 bg-transparent border-none py-3.5 px-2 text-sm outline-none ring-0 focus:ring-0"/>
        </div>

        <button (click)="onSend()"
                [disabled]="!messageText.trim()"
                class="bg-indigo-600 hover:bg-indigo-700 disabled:opacity-30 text-white w-12 h-12 rounded-2xl flex items-center justify-center shadow-lg transition-all active:scale-95"
                style="background-color: var(--primary-color);">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 rotate-45" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
            </svg>
        </button>
    </div>
</div>
