<div class="w-full h-full bg-gradient-to-br from-slate-900 via-indigo-950 to-purple-950 flex flex-col overflow-hidden">

    <header class="px-6 py-6 flex items-center justify-between border-b border-white/5">
        <div class="flex flex-col">
            <div class="flex items-center gap-2 mb-1">
                <span class="text-indigo-400 text-xs font-black uppercase tracking-widest">Progress</span>
                <span class="h-px w-8 bg-indigo-400/30"></span>
            </div>
            <div class="flex items-baseline gap-1">
                <span class="text-white text-3xl font-black tabular-nums">{{ getQuestionNumber() }}</span>
                <span class="text-white/30 text-lg font-medium">/ {{ getTotalQuestions() || '?' }}</span>
            </div>
        </div>

        <div class="flex flex-col items-end">
            <div class="bg-white/5 backdrop-blur-md border border-white/10 rounded-2xl px-5 py-3 flex items-center gap-4">
                <div class="text-right">
                    <p class="text-white/40 text-[10px] font-bold uppercase tracking-tighter">Players Ready</p>
                    <p class="text-white font-mono text-lg leading-none">{{ answeredCount }}<span class="opacity-30">/</span>{{ totalPlayers }}</p>
                </div>
                <div class="relative flex h-3 w-3">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                </div>
            </div>
        </div>
    </header>

    <div class="w-full">
        <div class="h-1.5 bg-white/5 w-full">
            <div class="h-full transition-all duration-1000 ease-linear"
                 [ngClass]="getTimerColor()"
                 [style.width.%]="getTimerPercentage()">
            </div>
        </div>
    </div>

    <main class="flex-1 flex flex-col items-center justify-center px-6 py-8">
        <div class="max-w-4xl w-full text-center space-y-6">
            <div class="inline-block px-4 py-1.5 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-300 text-xs font-bold uppercase tracking-widest animate-pulse">
                Current Question
            </div>
            <h1 class="text-3xl md:text-5xl font-black text-white leading-[1.1] tracking-tight drop-shadow-sm">
                {{ getQuestionText() }}
            </h1>
            <p [class.opacity-0]="hasAnswered" class="text-white/40 font-medium transition-opacity">
                Pick the best answer before time runs out!
            </p>
        </div>
    </main>

    <footer class="px-6 pb-10">
        <div class="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-4">
            <button *ngFor="let option of getOptions(); let i = index"
                    (click)="selectAnswer(option)"
                    [disabled]="hasAnswered || isSubmitting"
                    [ngClass]="[
                        selectedAnswer === option ? answerColors[i].selected + ' ring-offset-4 ring-offset-slate-950 scale-[1.02]' : answerColors[i].bg + ' ' + answerColors[i].hover,
                        'relative flex items-center p-5 md:p-7 rounded-2xl text-white transition-all duration-300 group shadow-xl'
                    ]"
                    class="disabled:opacity-40 disabled:cursor-not-allowed border border-white/10">

                <div [ngClass]="selectedAnswer === option ? 'bg-white text-slate-900' : 'bg-black/20 group-hover:bg-white/20'"
                     class="flex-shrink-0 w-10 h-10 rounded-xl flex items-center justify-center font-black transition-colors">
                    {{ answerLetters[i] }}
                </div>

                <span class="ml-5 text-lg md:text-xl font-bold text-left leading-tight flex-1">
                    {{ option }}
                </span>

                <div *ngIf="selectedAnswer === option" class="absolute right-6">
                    <div class="h-6 w-6 bg-white rounded-full flex items-center justify-center">
                        <svg class="w-4 h-4 text-slate-900" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M5 13l4 4L19 7"/>
                        </svg>
                    </div>
                </div>
            </button>
        </div>

        <div class="mt-8 flex justify-center h-16">
            <button (click)="confirmAnswer()"
                    *ngIf="selectedAnswer && !hasAnswered"
                    [disabled]="isSubmitting"
                    class="group relative inline-flex items-center gap-3 px-10 py-4 bg-indigo-500 hover:bg-indigo-400 text-white rounded-2xl font-black text-lg shadow-[0_0_30px_-5px_rgba(99,102,241,0.5)] transition-all active:scale-95">
                <span *ngIf="!isSubmitting">LOCK IT IN</span>
                <span *ngIf="isSubmitting" class="flex items-center gap-2">
                    <svg class="animate-spin h-5 w-5 text-white" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    PROCESSING...
                </span>
                <span class="group-hover:translate-x-1 transition-transform">→</span>
            </button>

            <div *ngIf="hasAnswered" class="flex items-center gap-3 px-8 py-3 bg-white/5 border border-white/10 rounded-2xl text-green-400 font-bold">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                WAITING FOR OTHERS...
            </div>
        </div>
    </footer>
</div>
