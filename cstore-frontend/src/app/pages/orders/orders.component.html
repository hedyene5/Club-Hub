<div class="p-6">
  <h2 class="text-2xl font-bold mb-6">Mes Commandes</h2>
  
  <div *ngIf="loading" class="text-center p-8">
    <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-gray-900"></div>
    <p class="mt-2">Chargement...</p>
  </div>

  <div *ngIf="!loading && orders.length === 0" class="text-center p-8 bg-gray-50 rounded-lg">
    <p class="text-gray-500">Aucune commande pour le moment</p>
    <button (click)="goToProducts()" class="mt-4 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
      Commencer vos achats
    </button>
  </div>

  <div *ngIf="!loading && orders.length > 0" class="space-y-4">
    <div *ngFor="let order of orders" class="border rounded-lg p-4 shadow-sm">
      <div class="flex justify-between items-start">
        <div>
          <p class="font-semibold">Commande #{{ order.orderNumber || order.id }}</p>
          <p class="text-sm text-gray-500">{{ order.orderDate | date }}</p>
          <p class="text-sm">Adresse: {{ order.shippingAddress }}</p>
        </div>
        <div class="text-right">
          <span class="px-2 py-1 rounded text-sm" [ngClass]="getStatusClass(order.status)">
            {{ getStatusLabel(order.status) }}
          </span>
          <p class="font-bold mt-2">{{ order.totalAmount }} €</p>
          <button *ngIf="order.status === 'PENDING'" 
                  (click)="cancelOrder(order.id!)" 
                  class="mt-2 text-red-500 text-sm hover:underline">
            Annuler
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
