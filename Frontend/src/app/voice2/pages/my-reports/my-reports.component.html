<div class="mx-auto max-w-screen-2xl p-4 md:p-6 2xl:p-10">
  <div class="mb-6">
    <h2 class="text-title-md2 font-semibold text-black dark:text-white">My Audio Reports</h2>
    <p class="text-sm text-body dark:text-bodydark">All voice reports submitted from your account</p>
  </div>

  <div *ngIf="error" class="mb-4 rounded border border-danger bg-red-50 px-4 py-3 text-sm text-danger dark:bg-meta-4">
    {{ error }}
  </div>

  <div class="rounded-sm border border-stroke bg-white shadow-default dark:border-strokedark dark:bg-boxdark">
    <div *ngIf="loading" class="flex items-center justify-center py-12 text-sm text-bodydark2">Loading your reports...</div>

    <div *ngIf="!loading && reports.length === 0" class="px-6 py-12 text-center text-sm text-bodydark2">
      You have not submitted any reports yet.
    </div>

    <div *ngIf="!loading && reports.length > 0" class="divide-y divide-stroke dark:divide-strokedark">
      <div *ngFor="let r of reports" class="px-6 py-4 flex items-center justify-between gap-4">
        <div>
          <p class="text-sm font-medium text-black dark:text-white">Reported: {{ r.reportedUserName }}</p>
          <p class="text-xs text-bodydark2">Reason: {{ r.reason }}</p>
          <p class="text-xs text-bodydark2">{{ r.createdAt | date:'short' }}</p>
        </div>
        <span class="rounded-full px-2.5 py-1 text-xs font-medium"
              [class.bg-warning/20]="r.status === 'PENDING'"
              [class.text-warning]="r.status === 'PENDING'"
              [class.bg-meta-3/20]="r.status === 'REVIEWED'"
              [class.text-meta-3]="r.status === 'REVIEWED'"
              [class.bg-red-100]="r.status === 'DISMISSED'"
              [class.text-red-700]="r.status === 'DISMISSED'">
          {{ r.status }}
        </span>
      </div>
    </div>
  </div>
</div>
